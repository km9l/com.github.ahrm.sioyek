name: qtwayland
buildsystem: cmake-ninja
config-opts:
  - -DFEATURE_wayland_server=OFF
sources:
  - type: archive
    url: https://download.qt.io/official_releases/qt/6.9/6.9.1/submodules/qtwayland-everywhere-src-6.9.1.tar.xz
    sha256: 7d21ea0e687180ebb19b9a1f86ae9cfa7a25b4f02d5db05ec834164409932e3e
    x-checker-data:
      type: anitya
      project-id: 7927
      stable-only: true
      versions:
        <: 6.10.0
      url-template: https://download.qt.io/official_releases/qt/6.9/$version/submodules/qtwayland-everywhere-src-$version.tar.xz
  - type: patch
    paths:
      - patch/qtwayland-use-adwaita-decorations-on-gnome-by-default.patch
modules:
  - name: qt6-qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DINSTALL_ARCHDATADIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DFEATURE_relocatable=OFF
      - -DFEATURE_rpath=OFF
      - -DFEATURE_precompile_header=OFF
      - -DFEATURE_openssl_linked=ON
      - -DFEATURE_sql=OFF
      - -DFEATURE_printsupport=OFF
      - -DFEATURE_testlib=OFF
      - -DFEATURE_eglfs=OFF
      - -DFEATURE_linuxfb=OFF
      - -DFEATURE_vnc=OFF
      - -DFEATURE_vkkhrdisplay=OFF
      - -DFEATURE_glibc_fortify_source=OFF # this clashes with gcc's own _FORTIFY_SOURCE setting
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.9/6.9.1/submodules/qtbase-everywhere-src-6.9.1.tar.xz
        sha256: 40caedbf83cc9a1959610830563565889878bc95f115868bbf545d1914acf28e
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.10.0
          url-template: https://download.qt.io/official_releases/qt/6.9/$version/submodules/qtbase-everywhere-src-$version.tar.xz
      - type: patch
        paths:
          - patch/qtbase-find_package-paths.patch
      - type: patch
        paths:
          - patch/qtbase-fix-static-build.patch
