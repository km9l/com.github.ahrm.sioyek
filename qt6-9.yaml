name: qtwayland
buildsystem: cmake-ninja
config-opts:
  - -DFEATURE_wayland_server=OFF
sources:
  - type: archive
    url: https://download.qt.io/official_releases/qt/6.9/6.9.0/submodules/qtwayland-everywhere-src-6.9.0.tar.xz
    sha256: 503416fcb04db503bd130e6a49c45e3e546f091e83406f774a0c703130c91805
    x-checker-data:
      type: anitya
      project-id: 7927
      stable-only: true
      versions:
        <: 6.10.0
      url-template: https://download.qt.io/official_releases/qt/6.9/$version/submodules/qtwayland-everywhere-src-$version.tar.xz
  - type: patch
    paths:
      - patch/qtwayland-use-adwaita-decorations-on-gnome-by-default.patch
modules:
  - name: qt6-qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DINSTALL_ARCHDATADIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DFEATURE_relocatable=OFF
      - -DFEATURE_rpath=OFF
      - -DFEATURE_precompile_header=OFF
      - -DFEATURE_openssl_linked=ON
      - -DFEATURE_sql=OFF
      - -DFEATURE_printsupport=OFF
      - -DFEATURE_testlib=OFF
      - -DFEATURE_eglfs=OFF
      - -DFEATURE_linuxfb=OFF
      - -DFEATURE_vnc=OFF
      - -DFEATURE_vkkhrdisplay=OFF
      - -DFEATURE_glibc_fortify_source=OFF # this clashes with gcc's own _FORTIFY_SOURCE setting
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.9/6.9.0/submodules/qtbase-everywhere-src-6.9.0.tar.xz
        sha256: c1800c2ea835801af04a05d4a32321d79a93954ee3ae2172bbeacf13d1f0598c
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.10.0
          url-template: https://download.qt.io/official_releases/qt/6.9/$version/submodules/qtbase-everywhere-src-$version.tar.xz
      - type: patch
        paths:
          - patch/qtbase-find_package-paths.patch
      - type: patch
        paths:
          - patch/qtbase-fix-static-build.patch
