name: qtwayland
buildsystem: cmake-ninja
cleanup:
  - /bin
  - /man
  - /share/man
  - /lib/systemd
  - '*.la'
  - /share/runtime/docs
  - /include
  - /share/aclocal
  - /share/pkgconfig
  - /lib/pkgconfig
  - /lib/*/pkgconfig
  - '*.a'
  - '*.cmake'
  - /lib/*/cmake
  - /mkspecs
  - /lib/mkspecs
  - '*.prl'
sources:
  - type: archive
    url: https://download.qt.io/official_releases/qt/6.8/6.8.2/submodules/qtwayland-everywhere-src-6.8.2.tar.xz
    sha256: 5e46157908295f2bf924462d8c0855b0508ba338ced9e810891fefa295dc9647
    x-checker-data:
      type: anitya
      project-id: 7927
      stable-only: true
      versions:
        <: 6.9.0
      url-template: https://download.qt.io/official_releases/qt/6.8/$version/submodules/qtwayland-everywhere-src-$version.tar.xz
  - type: patch
    paths:
      - patch/qtwayland-use-adwaita-decorations-on-gnome-by-default.patch
modules:
  - name: qt6-qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DINSTALL_LIBDIR=/app/lib/
      - -DINSTALL_ARCHDATADIR=lib
      - -DQT_DISABLE_RPATH=ON
      - -DBUILD_WITH_PCH=FALSE
      - -DQT_FEATURE_openssl_linked=ON
      - -DQT_FEATURE_sql=OFF
      - -DQT_FEATURE_printsupport=OFF
      - -DQT_FEATURE_testlib=OFF
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.8/6.8.2/submodules/qtbase-everywhere-src-6.8.2.tar.xz
        sha256: 012043ce6d411e6e8a91fdc4e05e6bedcfa10fcb1347d3c33908f7fdd10dfe05
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.9.0
          url-template: https://download.qt.io/official_releases/qt/6.8/$version/submodules/qtbase-everywhere-src-$version.tar.xz
      - type: patch
        paths:
          - patch/qtbase-find_package-paths.patch
  - name: qt6-qt3d
    buildsystem: cmake-ninja
    config-opts:
      - -DQT_FEATURE_qt3d_logic=OFF
      - -DQT_FEATURE_qt3d_render=OFF
      - -DQT_FEATURE_qt3d_extras=OFF
      - -DQT_FEATURE_qt3d_animation=OFF
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.8/6.8.2/submodules/qt3d-everywhere-src-6.8.2.tar.xz
        sha256: 577a6352f091a8d5fd087a0ac948befb185583959ee4048009073f0b377b8c44
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.9.0
          url-template: https://download.qt.io/official_releases/qt/6.8/$version/submodules/qt3d-everywhere-src-$version.tar.xz
  - name: qt6-qtsvg
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.8/6.8.2/submodules/qtsvg-everywhere-src-6.8.2.tar.xz
        sha256: aa2579f21ca66d19cbcf31d87e9067e07932635d36869c8239d4decd0a9dc1fa
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.9.0
          url-template: https://download.qt.io/official_releases/qt/6.8/$version/submodules/qtsvg-everywhere-src-$version.tar.xz
