name: qtwayland
buildsystem: cmake-ninja
config-opts:
  - -DFEATURE_wayland_server=OFF
sources:
  - type: archive
    url: https://download.qt.io/official_releases/qt/6.8/6.8.3/submodules/qtwayland-everywhere-src-6.8.3.tar.xz
    sha256: 20fe385887d21190165a3180c17dcfc8b9a0e1da4ec76865b6334bdc709994b0
    x-checker-data:
      type: anitya
      project-id: 7927
      stable-only: true
      versions:
        <: 6.9.0
      url-template: https://download.qt.io/official_releases/qt/6.8/$version/submodules/qtwayland-everywhere-src-$version.tar.xz
  - type: patch
    paths:
      - patch/qtwayland-use-adwaita-decorations-on-gnome-by-default.patch
modules:
  - name: qt6-qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DINSTALL_ARCHDATADIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DFEATURE_relocatable=OFF
      - -DFEATURE_rpath=OFF
      - -DFEATURE_precompile_header=OFF
      - -DFEATURE_openssl_linked=ON
      - -DFEATURE_sql=OFF
      - -DFEATURE_printsupport=OFF
      - -DFEATURE_testlib=OFF
      - -DFEATURE_eglfs=OFF
      - -DFEATURE_linuxfb=OFF
      - -DFEATURE_vnc=OFF
      - -DFEATURE_vkkhrdisplay=OFF
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz
        sha256: 56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.9.0
          url-template: https://download.qt.io/official_releases/qt/6.8/$version/submodules/qtbase-everywhere-src-$version.tar.xz
      - type: patch
        paths:
          - patch/qtbase-find_package-paths.patch
      - type: patch
        paths:
          - patch/qtbase-fix-static-build.patch
  - name: qt6-qtsvg
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.8/6.8.3/submodules/qtsvg-everywhere-src-6.8.3.tar.xz
        sha256: 35eb516460f00f264eb504baa253432384351cf23fb9980a5857190e8deef438
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.9.0
          url-template: https://download.qt.io/official_releases/qt/6.8/$version/submodules/qtsvg-everywhere-src-$version.tar.xz
