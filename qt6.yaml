name: qtwayland
buildsystem: cmake-ninja
config-opts:
  - -DFEATURE_wayland_server=OFF
sources:
  - type: archive
    url: https://download.qt.io/official_releases/qt/6.9/6.9.2/submodules/qtwayland-everywhere-src-6.9.2.tar.xz
    sha256: cad79806565568f12f9983fed69219416abcee9d5deef4abdfcf94aa2eef7781
    x-checker-data:
      type: anitya
      project-id: 7927
      stable-only: true
      versions:
        <: 6.10.0
      url-template: https://download.qt.io/official_releases/qt/6.9/$version/submodules/qtwayland-everywhere-src-$version.tar.xz
  - type: patch
    paths:
      - patch/qtwayland-use-adwaita-decorations-on-gnome-by-default.patch
modules:
  - name: qt6-qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DINSTALL_ARCHDATADIR=lib
      - -DFEATURE_rpath=OFF
      - -DFEATURE_precompile_header=OFF
      - -DFEATURE_openssl_linked=ON
      - -DFEATURE_sql=OFF
      - -DFEATURE_printsupport=OFF
      - -DFEATURE_testlib=OFF
      - -DFEATURE_vnc=OFF
      - -DFEATURE_glibc_fortify_source=OFF # this clashes with gcc's own _FORTIFY_SOURCE setting
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.9/6.9.2/submodules/qtbase-everywhere-src-6.9.2.tar.xz
