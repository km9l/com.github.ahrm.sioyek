name: qtwayland
buildsystem: cmake-ninja
config-opts:
  - -DFEATURE_wayland_server=OFF
sources:
  - type: archive
    url: https://download.qt.io/official_releases/qt/6.10/6.10.2/submodules/qtwayland-everywhere-src-6.10.2.tar.xz
    sha256: 391998eb432719df26a6a67d8efdc67f8bf2afdd76c1ee3381ebff4fe7527ee2
    x-checker-data:
      type: anitya
      project-id: 7927
      stable-only: true
      versions:
        <: 6.11.0
      url-template: https://download.qt.io/official_releases/qt/6.10/$version/submodules/qtwayland-everywhere-src-$version.tar.xz
modules:
  - name: qt6-qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DINSTALL_ARCHDATADIR=lib
      - -DFEATURE_rpath=OFF
      - -DFEATURE_precompile_header=OFF
      - -DFEATURE_openssl_linked=ON
      - -DFEATURE_sql=OFF
      - -DFEATURE_printsupport=OFF
      - -DFEATURE_testlib=OFF
      - -DFEATURE_vnc=OFF
      - -DFEATURE_glibc_fortify_source=OFF # this clashes with gcc's own _FORTIFY_SOURCE setting
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/qt/6.10/6.10.2/submodules/qtbase-everywhere-src-6.10.2.tar.xz
        sha256: aeb78d29291a2b5fd53cb55950f8f5065b4978c25fb1d77f627d695ab9adf21e
        x-checker-data:
          type: anitya
          project-id: 7927
          stable-only: true
          versions:
            <: 6.11.0
          url-template: https://download.qt.io/official_releases/qt/6.10/$version/submodules/qtbase-everywhere-src-$version.tar.xz
      - type: patch
        paths:
          - patch/qtbase-find_package-paths.patch
      - type: patch
        paths:
          - patch/qtbase-use-adwaita-decorations-on-gnome-by-default.patch
